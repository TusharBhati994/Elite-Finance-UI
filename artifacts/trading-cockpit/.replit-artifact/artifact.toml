kind = "web"
previewPath = "/"
title = "Trading Cockpit"
version = "1.0.0"
id = "artifacts/trading-cockpit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20596

[services.development]
run = "pnpm --filter @workspace/trading-cockpit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trading-cockpit", "run", "build" ]
publicDir = "artifacts/trading-cockpit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20596"
BASE_PATH = "/"
